<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Edit Configuration</title>
    <meta content="worker-src blob:; script-src data: 'self'; style-src 'self' 'unsafe-inline';" http-equiv="Content-Security-Policy">
    <link href="./style/styles.css" rel="stylesheet">
    <link href="./style/config-form.css" rel="stylesheet">
</head>
<body style="padding-bottom: 0">
<div class="editor-container">
    <div  class="editor-container-title">
        <div  class="editor-container-title-inner">
            <h2 style="font-family: 'Georgia', serif;">Edit Configuration</h2>
            <span id="profileEditIcon" class="profile-editor-icon"></span>
        </div>
        <div class='editor-category'>
                <div class="edit-tab-button selected"  id="fullConfigButton">full config(json)</div>
                <div class="edit-tab-button"  id="globalSettingsUIButton">global settings</div>
                <div class="edit-tab-button"  id="globalSettingsButton">global settings(json)</div>
                <div class="edit-tab-button"  id="hackFunctionsButton">hack functions</div>
        </div>
    </div>
    <div class="textarea-and-message">
        <div class="text-editor multiple" id="configEditor"></div>
        <div class="config-form-container" id="globalSettingsFormContainer"></div>
        <p id="infoOrErrorMessage" style="margin-left: 5px"></p>
    </div>
    <div class="editor-actions">
        <div style="padding: 0; margin-left: 5px">
            <button id="btnReset"  class="button-common">Reset Options</button>
        </div>
        <div style="padding: 0; margin-right: 5px">
            <button id="btnAbort"  class="button-common">Abort</button>
            <button id="btnSaveAndClose" class="button-common">Save and Close</button>
        </div>
    </div>
</div>
<script type="module" src="./src/editor-renderer.js"></script>
</body>
</html>
