<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Checkout-Proxy</title>
    <meta content="script-src 'self'; style-src 'self' 'unsafe-inline';" http-equiv="Content-Security-Policy">
    <link href="./style/styles.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="header">
        <h1 class="title">Checkout-Proxy</h1>
        <div class="status-info">
            <p style="display: flex; flex-direction: column;">
                <span id="activeProfile" style="display: flex; align-items: center; justify-content: flex-end">
                    <span style="margin-right: 4px">Active: </span>
                    <span class="active-profile-name" id="activeProfileName">None</span>
                    <span class="indicator" id="activeProfileIndicator"></span>
                </span>
                <span id="activePlaceholder"></span>
            </p>
            <p id="app-port">proxy port: <span id="httpPort">N/A</span>,<span id="httpsPort">N/A</span>
            </p>
            <p id="app-version-display">Version: loading...</p>
        </div>
    </div>

    <div class="buttons-panel">
        <button id="btnMainMoreOptions" class="button-common">More</button>
        <button id="btnEditConfig" class="button-common">Edit Config</button>
        <button id="btnImportConfig" class="button-common">Import Config</button>
        <button id="btnExportConfig" class="button-common">Export Config</button>
        <button id="btnDirectConnect" class="button-common">Direct Connect</button>
        <button id="btnStopProxy" class="button-common">Stop</button>
    </div>

    <p id="statusMessage"></p>
    <div class="profiles-area" id="profilesArea">
        <div class="profiles-area-inner">
        </div>
    </div>
</div>
<div class="overlay" id="placeholder-overlay">
    <div class="popover" id="placeholder-dialog">
        <div class="popover-content">
            <div id="placeholder-inputs">
            </div>
        </div>
        <div class="popover-actions">
            <div id="placeholder-ok-btn" tabindex="0">OK</div>
        </div>
    </div>
</div>
<div class="overlay" id="update-overlay">
    <div class="update-notification" id="update-notification">
        <div class="update-header">
            <div class="update-icon">🎉</div>
            <h2 class="update-title">New Update Available!</h2>
        </div>
        <div class="update-content">
            <p class="update-message">
                Version <strong id="update-version">0.0.0</strong> is now available.
            </p>
            <p class="update-current">
                You're currently on version <span id="current-version">0.0.0</span>
            </p>
        </div>
        <div class="update-actions">
            <button class="update-btn update-btn-primary" id="update-download-btn">
                <span>🚀</span> Check New Features & Download
            </button>
            <button class="update-btn update-btn-secondary" id="update-skip-btn">
                Skip This Version
            </button>
            <button class="update-btn update-btn-tertiary" id="update-snooze-btn">
                Snooze for 21 Days
            </button>
        </div>
    </div>
</div>
<script src="./src/renderer.js" type="module"></script>
</body>
</html>
